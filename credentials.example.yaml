# Copy to credentials.yaml in your config folder (git-ignored) and fill in.
# One section per environment. The section name is the environment name used on the command line.

lab:
  # Regional New Central API gateway, e.g. https://<cluster>.api.central.arubanetworks.com
  base_url: CHANGE_ME
  # API client from GreenLake (client credentials grant)
  client_id: CHANGE_ME
  client_secret: CHANGE_ME
  # Optional: override the token endpoint if your workspace uses a different one
  # token_url: https://sso.common.cloud.hpe.com/as/token.oauth2
