[project]
name = "cnx-as-code"
version = "0.1.0"
description = "Config as code for HPE Aruba Networking Central (new Central) AP and Central NAC configuration"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "rich>=15",
    "typer>=0.27",
]

[project.scripts]
cnxac = "cnxac.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnxac"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
